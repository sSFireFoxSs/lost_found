services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: lost_found
      POSTGRES_PASSWORD: lost_found_dev
      POSTGRES_DB: lost_found
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lost_found -d lost_found"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres_data:
