<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>분실물 신고 | 경찰민원24 (제안 시안)</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<main class="inner">
  <div id="crumb"></div>
  <div class="page-title-wrap"><h1 class="h-tit">분실물 신고<span class="tag-proposal">제안</span></h1></div>
  <div id="tabs"></div>

  <div class="txt-box">
    <p>잃어버린 물건을 신고하시면 등록된 습득물 공고와 자동으로 비교해 드립니다.</p>
    <hr>
    <span class="text-primary">※ 공개 특징은 매칭에 쓰고, 나만 아는 특징은 공고에 올리지 않고 물건을 찾을 때 본인 확인에만 씁니다.</span>
  </div>

  <form id="form" class="form-area">
    <div class="form-head">분실물 정보 입력</div>
    <div class="form-body"><div class="form-grid">
      <label>분실자명<span class="req">*</span></label><input name="name" placeholder="이름을 입력해주세요" required>
      <label>연락처<span class="req">*</span></label><input name="phone" placeholder="010-0000-0000" required>
      <div class="div"></div>
      <label>분실일자<span class="req">*</span></label><input type="date" name="date" required>
      <label>분실지역</label>
      <select name="region">
        <option value="">선택</option><option>서울특별시</option><option>강원도</option><option>경기도</option><option>경상남도</option>
        <option>경상북도</option><option>전남광주통합특별시</option><option>대구광역시</option><option>대전광역시</option><option>부산광역시</option>
        <option>울산광역시</option><option>인천광역시</option><option>전북특별자치도</option><option>충청남도</option><option>충청북도</option>
        <option>제주특별자치도</option><option>세종특별자치시</option><option>해외</option><option>기타</option>
      </select>
      <label>분실장소</label><input class="full" name="place" placeholder="예) 2호선 강남역 근처 (잘 모르면 비워 두세요)">
      <label>물품 분류<span class="req">*</span></label>
      <div class="full pair"><select name="category_main" id="main" required></select><select name="category_sub" id="sub"></select></div>
      <label>분실물명<span class="req">*</span></label><input class="full" name="item_name" placeholder="분실물명을 입력해주세요. 예) 남색 장우산" required>
      <div class="div"></div>
      <label>공개 특징</label>
      <div class="full"><textarea name="public" placeholder="색상, 브랜드, 크기처럼 다른 사람이 봐도 되는 특징"></textarea></div>
      <label>나만 아는 특징</label>
      <div class="full">
        <textarea name="secret" placeholder="내용물, 스티커 문구, 흠집 위치, 잠금화면처럼 주인만 아는 특징"></textarea>
        <div class="hint">공고에 공개되지 않고, 물건을 찾으러 갔을 때 본인 확인 질문에만 씁니다.</div>
      </div>
      <label>사진</label><div class="full"><input type="file" name="photo" accept="image/*"><div class="hint">비슷한 물건 사진도 괜찮습니다.</div></div>
    </div>
    <div class="btn-wrap"><button type="reset" class="krds-btn">초기화</button><button class="krds-btn primary">신고하기</button></div>
    <div id="toast"></div>
    </div>
  </form>
</main>

<script src="/common.js"></script>
<script>
// UI만: 신고 저장·매칭은 다음 단계에서 붙인다
fillCategories($("main"), $("sub"));
document.querySelector("[name=date]").value = today();
$("form").onsubmit = (e) => {
  e.preventDefault();
  $("toast").className = "toast err";
  $("toast").textContent = "신고 기능은 준비 중입니다. (화면만 있는 상태)";
};
</script>
</body>
</html>
